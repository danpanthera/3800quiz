# Nginx BÊN TRONG container web — phục vụ SPA React đã build.
#
# Ở PRODUCTION, Caddy gọi thẳng api:13011 cho /api và /socket.io nên hai khối
# proxy phía dưới không được dùng tới. Vẫn giữ lại vì:
#   (1) container web phải chạy độc lập được ở môi trường dev (cổng 15174),
#   (2) là phương án dự phòng nếu sau này bỏ Caddy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Mặc định Nginx chỉ cho 1MB, trong khi Multer cho phép 10MB. Import Excel
    # danh sách cán bộ / ngân hàng câu hỏi lớn hơn 1MB sẽ bị chặn 413 ngay tại
    # đây và không bao giờ tới được API.
    client_max_body_size 20m;
    client_body_timeout 120s;

    # ── Nén ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ── Tài nguyên có mã băm trong tên file ────────────────────────────────
    # Vite build ra /assets/index-<hash>.js, đổi nội dung là đổi tên file nên
    # cache vĩnh viễn hoàn toàn an toàn.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2|woff|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Ảnh/icon trong public/ không có mã băm → cache ngắn, cho phép kiểm tra lại
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp)$ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ── Tuyệt đối không cache: điểm vào SPA và service worker ──────────────
    # vite-plugin-pwa sinh sw.js / registerSW.js / manifest.webmanifest. Nếu
    # trình duyệt giữ sw.js cũ, cán bộ sẽ kẹt ở phiên bản cũ sau khi cập nhật
    # — rất khó chẩn đoán từ xa.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── SPA fallback cho react-router ──────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy API (dùng ở dev, hoặc khi chạy container web độc lập) ────────
    location /api/ {
        proxy_pass http://api:13011/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Proxy Socket.IO (dùng ở dev) ──────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://api:13011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mặc định proxy_read_timeout là 60s → Nginx tự cắt WebSocket đang rảnh
        # (chủ phòng Đấu trường mở sảnh chờ hơn 60 giây không có sự kiện nào).
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }
}
